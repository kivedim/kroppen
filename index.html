<style>
/* Layout: anatomy-atlas lightbox. Full-screen WebGL figure on a cool pale ground; top bar + parts index; bottom info card above layer checkboxes */
:root{
  --ground:#e4eaec; --ground-2:#d3dde1; --panel:rgba(250,252,252,.92); --line:rgba(29,42,51,.16);
  --ink:#1d2a33; --ink-dim:#5b6b75; --accent:#0f7c78; --accent-ink:#ffffff; --warm:#b8403a;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Source Sans 3", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;}
body{background:radial-gradient(120% 80% at 50% 38%, var(--ground) 0%, var(--ground-2) 100%);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent;}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-block:calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 10px);}
.ui > *{pointer-events:auto;}
.topwrap{display:flex;flex-direction:column;gap:8px;max-width:560px;width:100%;align-self:center;min-height:0;}
.top{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;backdrop-filter:blur(6px);}
.top h1{font:800 18px/1 var(--font-display);margin:0 auto 0 0;}
.ibtn{height:40px;min-width:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 15px/1 var(--font-body);cursor:pointer;flex:none;}
.ibtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.ibtn.live{color:var(--warm);}
.ibtn.live[aria-pressed="false"]{color:var(--ink-dim);opacity:.6;}
.card .head{display:flex;align-items:flex-start;gap:10px;}
.card .head > div{flex:1;min-width:0;}
.card .lat{margin:3px 0 0;font:italic 400 14px/1.3 var(--font-body);color:var(--ink-dim);}
.speak{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--accent);display:grid;place-items:center;cursor:pointer;}
.speak[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;}
.lang button{height:38px;min-width:38px;padding:0 8px;border:0;background:transparent;color:var(--ink-dim);font:800 13px/1 var(--font-display);letter-spacing:.05em;cursor:pointer;}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px;max-height:55vh;overflow-y:auto;backdrop-filter:blur(8px);}
.list h3{font:800 12px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
.list h3 i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25);}
.list .items{display:flex;flex-wrap:wrap;gap:6px;}
.list button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px/1.1 var(--font-body);cursor:pointer;}
.credit{font-size:12px;line-height:1.4;color:var(--ink-dim);margin:14px 0 0;}
.credit a{color:var(--accent);}
.bottom{display:flex;flex-direction:column;gap:8px;max-width:560px;width:100%;align-self:center;}
.hint{align-self:center;font-size:14px;color:var(--ink-dim);background:var(--panel);padding:6px 12px;border-radius:999px;transition:opacity .6s;text-align:center;border:1px solid var(--line);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(8px);max-height:40vh;overflow-y:auto;}
.card .kind{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;}
.card .kind i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25);}
.card h2{font:800 28px/1.05 var(--font-display);margin:0;text-wrap:balance;}
.card .desc{margin:8px 0 10px;font-size:16px;line-height:1.5;}
.card .fun{font-size:15px;line-height:1.5;color:var(--ink-dim);margin:0 0 12px;padding-left:10px;border-left:3px solid var(--warm);}
.actions{display:flex;gap:8px;flex-wrap:wrap;}
.actions button{flex:1;min-width:140px;font:600 15px/1 var(--font-body);padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
.actions button[aria-pressed="true"]{background:var(--warm);color:#fff;border-color:var(--warm);}
.layers{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.layers::-webkit-scrollbar{display:none;}
.lyr{flex:none;display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);font:600 14px/1 var(--font-body);cursor:pointer;}
.lyr .box{width:16px;height:16px;border-radius:5px;border:2px solid currentColor;display:grid;place-items:center;font-size:11px;line-height:1;}
.lyr[aria-pressed="true"]{color:var(--ink);border-color:rgba(29,42,51,.4);background:#fff;}
.lyr[aria-pressed="true"] .box{background:var(--c);border-color:rgba(0,0,0,.35);color:#1d2a33;}
.lyr[aria-pressed="true"] .box::after{content:"✓";font-weight:700;}
.lyr.xray{border-style:dashed;}
.loading{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .5s;}
.loading div{display:flex;flex-direction:column;align-items:center;gap:10px;font:600 16px var(--font-display);color:var(--ink-dim);}
.loading .bar{width:180px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
.loading .bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s;}
.loading small{font:400 12px var(--font-body);}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (max-width:400px){.top h1{font-size:16px;}}
@media (prefers-reduced-motion: reduce){.hint,.loading{transition:none;}}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D-modell av människokroppen"></canvas>
<div class="loading" id="loading"><div><span id="loadTxt">Laddar kroppen…</span><span class="bar"><span id="loadBar"></span></span><small>BodyParts3D © DBCLS · CC BY-SA</small></div></div>
<div class="ui">
  <div class="topwrap">
    <div class="top">
      <h1 id="ttl">Kroppen</h1>
      <button class="ibtn" id="listBtn" aria-expanded="false">☰ Delar</button>
      <button class="ibtn" id="home" aria-label="Visa hela kroppen">⌂</button>
      <button class="ibtn live" id="live" aria-pressed="true" aria-label="Hjärtslag och andning"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="currentColor"/></svg></button>
      <div class="lang" role="group" aria-label="Språk / Language"><button id="lang-sv" aria-pressed="true">SV</button><button id="lang-en" aria-pressed="false">EN</button></div>
    </div>
    <div class="list" id="list" hidden></div>
  </div>
  <div class="bottom">
    <div class="hint" id="hint"></div>
    <section class="card" id="card" hidden aria-live="polite"></section>
    <nav class="layers" id="layers"></nav>
  </div>
</div>

<script>
/* ================= content ================= */
const SYS={skin:['Huden','Integumentary system'],musc:['Muskler','Muscular system'],skel:['Skelettet','Skeletal system'],nerv:['Nervsystemet','Nervous system'],
 resp:['Andningsorganen','Respiratory system'],dig:['Matsmältningen','Digestive system'],circ:['Hjärta och blodomlopp','Circulatory system'],uri:['Urinvägarna','Urinary system'],
 endo:['Hormonsystemet','Endocrine system'],imm:['Immunförsvaret','Immune system'],sense:['Sinnesorgan','Sense organs']};
const LAYERS=[
 {id:'skin',sv:'Hud',en:'Skin',c:'#e8b896'},{id:'muscle',sv:'Muskler',en:'Muscles',c:'#c9524b'},{id:'skeleton',sv:'Skelett',en:'Skeleton',c:'#efe6d2'},
 {id:'organs',sv:'Organ',en:'Organs',c:'#eaa9b2'},{id:'nerves',sv:'Nerver',en:'Nerves',c:'#f0cf4a'},{id:'arteries',sv:'Artärer',en:'Arteries',c:'#e0413f'},{id:'veins',sv:'Vener',en:'Veins',c:'#4d72e0'}];
const INFO={
 skin:{sys:'skin',sv:['Huden','Kroppens största organ. Den skyddar mot bakterier, håller kvar vätska och hjälper till att reglera kroppstemperaturen.','En vuxen har ungefär 2 kvadratmeter hud, och de yttersta hudcellerna byts ut på ungefär en månad.'],
  en:['Skin','The body’s largest organ. It protects against germs, keeps fluids in and helps control body temperature.','An adult has about 2 square meters of skin, and the outermost skin cells are replaced in about a month.']},
 muscles:{sys:'musc',sv:['Musklerna','Kroppen har över 600 skelettmuskler. De kan bara dra, aldrig trycka, så de arbetar ofta i par som drar åt var sitt håll.','Ungefär 40 procent av en vuxens kroppsvikt är muskler.'],
  en:['Muscles','The body has more than 600 skeletal muscles. They can only pull, never push, so they often work in pairs that pull in opposite directions.','About 40 percent of an adult’s body weight is muscle.']},
 pectoralis:{sys:'musc',sv:['Stora bröstmuskeln','Stor solfjäderformad muskel på bröstet. Den för armen framåt och in mot kroppen, som när man kramar någon.','Armhävningar tränar framför allt den här muskeln.'],
  en:['Pectoralis major','A large fan-shaped muscle on the chest. It moves the arm forward and in toward the body, like when you hug someone.','Push-ups mainly train this muscle.']},
 deltoid:{sys:'musc',sv:['Deltamuskeln','Muskeln som ger axeln dess runda form. Den lyfter armen åt sidan, framåt och bakåt.','Namnet kommer från den grekiska bokstaven delta (Δ), eftersom muskeln är triangelformad.'],
  en:['Deltoid','The muscle that gives the shoulder its round shape. It lifts the arm to the side, forward and backward.','The name comes from the Greek letter delta (Δ), because the muscle is shaped like a triangle.']},
 biceps:{sys:'musc',sv:['Biceps','Sitter på framsidan av överarmen och böjer armbågen. Den vrider också underarmen så att handflatan vänds uppåt.','Biceps betyder ”två huvuden”. Muskeln har två fästen uppe vid axeln.'],
  en:['Biceps','Sits on the front of the upper arm and bends the elbow. It also turns the forearm so the palm faces up.','Biceps means “two heads”. The muscle has two attachments up at the shoulder.']},
 triceps:{sys:'musc',sv:['Triceps','Sitter på baksidan av överarmen och sträcker armbågen. Den är biceps motspelare.','Triceps är faktiskt större än biceps och utgör ungefär två tredjedelar av överarmens muskler.'],
  en:['Triceps','Sits on the back of the upper arm and straightens the elbow. It works against the biceps.','The triceps is actually bigger than the biceps and makes up about two thirds of the upper arm’s muscle.']},
 forearm:{sys:'musc',sv:['Underarmens muskler','Ett tjugotal muskler som styr handleden och fingrarna. Fingrarna har nästan inga egna muskler utan dras i via långa senor, som en marionett.','Rör på fingrarna och känn efter: det är underarmen som jobbar.'],
  en:['Forearm muscles','About twenty muscles that move the wrist and fingers. The fingers have almost no muscles of their own; they are pulled by long tendons, like a puppet.','Wiggle your fingers and feel your forearm: that is where the work happens.']},
 rectus:{sys:'musc',sv:['Raka bukmuskeln','Går från bröstkorgen ner till bäckenet och böjer bålen framåt, som när man gör situps.','Senor delar muskeln i rutor. Det är därför man kan få ett ”sexpack”.'],
  en:['Rectus abdominis','Runs from the rib cage down to the pelvis and bends the trunk forward, like when you do sit-ups.','Tendons divide the muscle into boxes. That is why people can get a “six-pack”.']},
 obliques:{sys:'musc',sv:['Sneda bukmusklerna','Bukmusklerna på sidorna. De vrider och böjer bålen och hjälper till när man hostar eller skrattar.','Det finns yttre och inre sneda bukmuskler, och deras fibrer korsar varandra som ett X.'],
  en:['Obliques','The side abdominal muscles. They twist and bend the trunk and help when you cough or laugh.','There are outer and inner obliques, and their fibers cross each other like an X.']},
 trapezius:{sys:'musc',sv:['Kappmuskeln','Stor, platt muskel på övre ryggen och nacken. Den lyfter axlarna och håller skulderbladen på plats.','Musklerna på båda sidor bildar tillsammans en trapets. Därav det latinska namnet trapezius.'],
  en:['Trapezius','A large flat muscle on the upper back and neck. It lifts the shoulders and holds the shoulder blades in place.','Together the muscles on both sides form a trapezoid, which gives it its name.']},
 latissimus:{sys:'musc',sv:['Breda ryggmuskeln','Ryggens bredaste muskel. Den drar armen nedåt och bakåt, som när man klättrar eller simmar.','Latissimus dorsi betyder ”ryggens bredaste” på latin.'],
  en:['Latissimus dorsi','The widest muscle of the back. It pulls the arm down and back, like when you climb or swim.','Latissimus dorsi is Latin for “widest of the back”.']},
 gluteus:{sys:'musc',sv:['Stora sätesmuskeln','Kroppens största muskel. Den sträcker höften så att man kan resa sig, gå i trappor och springa.','Den hjälper oss att stå upprätt. Människor har mycket större sätesmuskler än schimpanser.'],
  en:['Gluteus maximus','The body’s largest muscle. It straightens the hip so you can stand up, climb stairs and run.','It helps us stand upright. Humans have much bigger buttock muscles than chimpanzees.']},
 quadriceps:{sys:'musc',sv:['Fyrhövdade lårmuskeln','Fyra muskler på lårets framsida som sträcker knät. De behövs för att gå, hoppa och sparka.','Knäskålen sitter inbäddad i den här muskelns sena.'],
  en:['Quadriceps','Four muscles on the front of the thigh that straighten the knee. You need them to walk, jump and kick.','The kneecap sits inside this muscle’s tendon.']},
 hamstrings:{sys:'musc',sv:['Baksida lår','Tre muskler på lårets baksida som böjer knät och sträcker höften.','Det är de här som känns spända när man försöker nudda tårna.'],
  en:['Hamstrings','Three muscles on the back of the thigh that bend the knee and straighten the hip.','These are the ones that feel tight when you try to touch your toes.']},
 calf:{sys:'musc',sv:['Vadmuskeln','Sitter på underbenets baksida. Den lyfter hälen så att man kan stå på tå och skjuta ifrån när man går.','Den fäster i hälen via akillessenan, kroppens starkaste sena.'],
  en:['Calf muscle','Sits on the back of the lower leg. It lifts the heel so you can stand on your toes and push off when you walk.','It attaches to the heel through the Achilles tendon, the strongest tendon in the body.']},
 tibialis:{sys:'musc',sv:['Främre skenbensmuskeln','Muskeln på framsidan av underbenet. Den lyfter fotens framdel så att tårna inte släpar i marken när man går.','Spänn den genom att dra upp tårna mot dig.'],
  en:['Tibialis anterior','The muscle on the front of the lower leg. It lifts the front of the foot so your toes don’t drag when you walk.','Tighten it by pulling your toes up toward you.']},
 scm:{sys:'musc',sv:['Nickmuskeln','Går från bakom örat ner till bröstbenet och nyckelbenet. Den vrider och böjer huvudet.','Den syns tydligt på halsen när man vrider huvudet åt sidan.'],
  en:['Sternocleidomastoid','Runs from behind the ear down to the breastbone and collarbone. It turns and tilts the head.','You can clearly see it on the neck when you turn your head to the side.']},
 skull:{sys:'skel',sv:['Skallen','Skyddar hjärnan och består av 22 ben som har vuxit ihop, alla utom underkäken.','Hos bebisar har skallbenen inte vuxit ihop än. De mjuka fläckarna kallas fontaneller.'],
  en:['Skull','Protects the brain and is made of 22 bones that have grown together, all except the lower jaw.','In babies the skull bones haven’t joined yet. The soft spots are called fontanelles.']},
 mandible:{sys:'skel',sv:['Underkäken','Skallens enda rörliga ben. Den bär de nedre tänderna.','Den är det största och starkaste benet i ansiktet.'],
  en:['Mandible','The only movable bone of the skull. It holds the lower teeth.','It is the largest and strongest bone in the face.']},
 spine:{sys:'skel',sv:['Ryggraden','Består av 33 kotor: 7 i halsen, 12 i bröstryggen, 5 i ländryggen samt korsbenet och svanskotan. Den bär kroppen och skyddar ryggmärgen.','Både människor och giraffer har sju halskotor. Giraffens är bara mycket längre.'],
  en:['Spine','Made of 33 vertebrae: 7 in the neck, 12 in the upper back, 5 in the lower back plus the sacrum and tailbone. It holds the body up and protects the spinal cord.','Humans and giraffes both have seven neck vertebrae. A giraffe’s are just much longer.']},
 ribs:{sys:'skel',sv:['Revbenen','Bildar en bur som skyddar hjärtat och lungorna. De flesta människor har 12 par.','De två nedersta paren sitter inte fast framtill och kallas fria revben.'],
  en:['Ribs','Form a cage that protects the heart and lungs. Most people have 12 pairs.','The two lowest pairs aren’t attached at the front and are called floating ribs.']},
 sternum:{sys:'skel',sv:['Bröstbenet','Ett platt ben mitt på bröstet där de övre revbenen fäster med brosk.','Bröstbenets benmärg tillverkar blodkroppar hela livet.'],
  en:['Sternum','A flat bone in the middle of the chest where the upper ribs attach with cartilage.','The bone marrow in the sternum makes blood cells throughout life.']},
 clavicle:{sys:'skel',sv:['Nyckelbenet','Går från bröstbenet till axeln och håller armen ut från kroppen.','Det är ett av de ben som oftast bryts, ofta när man ramlar på en utsträckt arm.'],
  en:['Collarbone','Runs from the breastbone to the shoulder and holds the arm out from the body.','It is one of the most commonly broken bones, often from falling on an outstretched arm.']},
 scapula:{sys:'skel',sv:['Skulderbladet','Platt, triangelformat ben på ryggen. Det rör sig fritt och ger axeln dess stora rörlighet.','Skulderbladet sitter bara fast i skelettet via nyckelbenet. Resten hålls på plats av muskler.'],
  en:['Shoulder blade','A flat triangular bone on the back. It moves freely and gives the shoulder its huge range of motion.','The shoulder blade is only joined to the skeleton through the collarbone. Muscles hold the rest in place.']},
 pelvis:{sys:'skel',sv:['Bäckenet','Bär överkroppens vikt och för den vidare till benen. Det skyddar också urinblåsan och tarmarna.','Kvinnors bäcken är oftast bredare och rundare än mäns, så att barn kan födas.'],
  en:['Pelvis','Carries the weight of the upper body and passes it on to the legs. It also protects the bladder and intestines.','Women’s pelvises are usually wider and rounder than men’s, so that babies can be born.']},
 humerus:{sys:'skel',sv:['Överarmsbenet','Går från axeln till armbågen. Den runda toppen sitter i axelleden.','Den stickande ”tjuvnerv”-känslan i armbågen kommer från en nerv som passerar där, inte från benet.'],
  en:['Humerus','Runs from the shoulder to the elbow. Its round top sits in the shoulder joint.','The “funny bone” feeling actually comes from a nerve. The name may be a pun on humerus and humorous.']},
 radius:{sys:'skel',sv:['Strålbenet','Sitter på tumsidan av underarmen. Det kan rotera runt armbågsbenet så att handflatan vänds.','Det är det ben som oftast bryts vid en handledsfraktur.'],
  en:['Radius','On the thumb side of the forearm. It can rotate around the ulna to turn the palm.','It is the bone most often broken in a wrist fracture.']},
 ulna:{sys:'skel',sv:['Armbågsbenet','Sitter på lillfingersidan av underarmen. Dess övre ände är den spetsiga knölen i armbågen.','Det du stöder armbågen mot bordet med är armbågsbenet.'],
  en:['Ulna','On the little-finger side of the forearm. Its top end is the pointy bump of your elbow.','When you lean your elbow on a table, you are resting on your ulna.']},
 hand:{sys:'skel',sv:['Handens ben','Handen och handleden har 27 ben. Det gör handen otroligt rörlig och exakt.','Händer och fötter innehåller tillsammans över hälften av kroppens 206 ben.'],
  en:['Hand bones','The hand and wrist have 27 bones. That makes the hand incredibly flexible and precise.','Hands and feet together contain more than half of the body’s 206 bones.']},
 femur:{sys:'skel',sv:['Lårbenet','Kroppens längsta och starkaste ben. Det går från höften till knät.','Ett lårben är ungefär en fjärdedel av en människas längd.'],
  en:['Femur','The longest and strongest bone in the body. It runs from the hip to the knee.','A femur is about a quarter of a person’s height.']},
 patella:{sys:'skel',sv:['Knäskålen','Ett litet ben framför knät som skyddar leden och ger lårmusklerna bättre hävstång.','Bebisar föds med knäskålar av brosk som blir ben först efter några år.'],
  en:['Kneecap','A small bone in front of the knee that protects the joint and gives the thigh muscles better leverage.','Babies are born with kneecaps made of cartilage that only turn to bone after a few years.']},
 tibia:{sys:'skel',sv:['Skenbenet','Underbenets kraftiga ben som bär nästan all vikt. Det ligger precis under huden på framsidan.','Därför gör det så ont att slå i smalbenet: det finns nästan inget skydd över benet.'],
  en:['Tibia','The strong bone of the lower leg that carries almost all the weight. It lies just under the skin at the front.','That is why banging your shin hurts so much: there is almost nothing protecting the bone.']},
 fibula:{sys:'skel',sv:['Vadbenet','Det smala benet på utsidan av underbenet. Det bär lite vikt men är fäste för muskler och stabiliserar fotleden.','Den yttre knölen på fotleden är vadbenets nedre ände.'],
  en:['Fibula','The thin bone on the outside of the lower leg. It carries little weight but anchors muscles and steadies the ankle.','The bump on the outside of your ankle is the bottom end of the fibula.']},
 foot:{sys:'skel',sv:['Fotens ben','Foten har 26 ben. Den bär hela kroppens vikt och fungerar som stötdämpare.','Hälbenet är fotens största ben.'],
  en:['Foot bones','The foot has 26 bones. It carries the whole body’s weight and works as a shock absorber.','The heel bone is the largest bone in the foot.']},
 brain:{sys:'nerv',sv:['Hjärnan','Styr allt kroppen gör: tankar, minne, känslor, rörelser och sinnen. Den väger ungefär 1,3–1,4 kg hos en vuxen.','Hjärnan har runt 86 miljarder nervceller och använder ungefär en femtedel av kroppens energi.'],
  en:['Brain','Controls everything the body does: thoughts, memory, feelings, movement and senses. It weighs about 1.3–1.4 kg in an adult.','The brain has around 86 billion nerve cells and uses about a fifth of the body’s energy.']},
 cerebellum:{sys:'nerv',sv:['Lillhjärnan','Sitter längst bak under storhjärnan och samordnar rörelser och balans.','Fast den är liten innehåller den mer än hälften av hjärnans nervceller.'],
  en:['Cerebellum','Sits at the back below the main brain and coordinates movement and balance.','Although it is small, it contains more than half of the brain’s nerve cells.']},
 eyes:{sys:'sense',sv:['Ögonen','Tar in ljus och gör om det till nervsignaler som hjärnan tolkar som bilder.','Bilden på näthinnan är upp och ner. Hjärnan vänder på den.'],
  en:['Eyes','Take in light and turn it into nerve signals that the brain reads as pictures.','The image on the retina is upside down. The brain flips it.']},
 thyroid:{sys:'endo',sv:['Sköldkörteln','Fjärilsformad körtel framtill på halsen. Dess hormoner styr hur snabbt kroppen förbrukar energi.','Den behöver jod för att kunna tillverka sina hormoner.'],
  en:['Thyroid','A butterfly-shaped gland at the front of the neck. Its hormones control how fast the body uses energy.','It needs iodine to make its hormones.']},
 trachea:{sys:'resp',sv:['Luftstrupen','Leder luft från halsen ner till lungorna. Den hålls öppen av C-formade broskringar och delar sig i två luftrör.','Du kan känna broskringarna om du försiktigt känner på halsens framsida.'],
  en:['Windpipe (trachea)','Carries air from the throat down to the lungs. C-shaped rings of cartilage keep it open, and it splits into two bronchi.','You can feel the cartilage rings if you gently touch the front of your neck.']},
 esophagus:{sys:'dig',sv:['Matstrupen','En muskelslang som för maten från svalget ner till magsäcken med vågliknande rörelser.','Maten kommer fram även om man står på huvudet, tack vare de här muskelvågorna.'],
  en:['Esophagus','A muscular tube that moves food from the throat down to the stomach with wave-like squeezes.','Food gets there even if you stand on your head, thanks to these muscle waves.']},
 lungR:{sys:'resp',sv:['Höger lunga','Lite större än den vänstra och har tre lober. I lungorna tas syre upp i blodet och koldioxid lämnas ut.','Lungorna har hundratals miljoner små lungblåsor. Utbredda skulle de täcka ungefär en halv tennisbana.'],
  en:['Right lung','Slightly bigger than the left and has three lobes. In the lungs oxygen goes into the blood and carbon dioxide comes out.','The lungs have hundreds of millions of tiny air sacs. Spread out, they would cover about half a tennis court.']},
 lungL:{sys:'resp',sv:['Vänster lunga','Har två lober och är lite mindre för att ge plats åt hjärtat.','Inbuktningen där hjärtat ligger kallas hjärtinbuktningen.'],
  en:['Left lung','Has two lobes and is a bit smaller to make room for the heart.','The dent where the heart sits is called the cardiac notch.']},
 heart:{sys:'circ',sv:['Hjärtat','En muskel som pumpar blod genom kroppen. Det har fyra rum: två förmak och två kammare.','Det slår ungefär 100 000 gånger per dygn och är ungefär lika stort som en knuten näve.'],
  en:['Heart','A muscle that pumps blood around the body. It has four chambers: two atria and two ventricles.','It beats about 100,000 times a day and is roughly the size of a clenched fist.']},
 diaphragm:{sys:'resp',sv:['Mellangärdet','En kupolformad muskel under lungorna. När den drar ihop sig sugs luft in i lungorna.','Hicka är små plötsliga ryck i mellangärdet.'],
  en:['Diaphragm','A dome-shaped muscle under the lungs. When it tightens, air is pulled into the lungs.','Hiccups are small sudden jerks of the diaphragm.']},
 liver:{sys:'dig',sv:['Levern','Det största inre organet. Den renar blodet, lagrar näring och tillverkar galla som hjälper till att bryta ner fett.','Levern kan växa tillbaka även om en stor del av den tas bort.'],
  en:['Liver','The largest internal organ. It cleans the blood, stores nutrients and makes bile that helps break down fat.','The liver can grow back even if a large part of it is removed.']},
 gallbladder:{sys:'dig',sv:['Gallblåsan','En liten påse under levern som lagrar galla och släpper ut den i tarmen när man äter fet mat.','Man kan leva utan gallblåsa. Då rinner gallan direkt från levern.'],
  en:['Gallbladder','A small pouch under the liver that stores bile and releases it into the gut when you eat fatty food.','You can live without a gallbladder. The bile then flows straight from the liver.']},
 stomach:{sys:'dig',sv:['Magsäcken','Tar emot maten, blandar den och bryter ner den med syra och enzymer.','Magsyran är så stark att magen måste skydda sig själv med ett lager slem.'],
  en:['Stomach','Receives food, churns it and breaks it down with acid and enzymes.','Stomach acid is so strong that the stomach has to protect itself with a layer of mucus.']},
 spleen:{sys:'imm',sv:['Mjälten','Sitter till vänster bakom magsäcken. Den filtrerar blodet, tar bort gamla röda blodkroppar och hjälper immunförsvaret.','Man kan leva utan mjälte, men blir lite känsligare för vissa infektioner.'],
  en:['Spleen','Sits on the left behind the stomach. It filters the blood, removes old red blood cells and helps the immune system.','You can live without a spleen, but you become a bit more vulnerable to some infections.']},
 pancreas:{sys:'dig',sv:['Bukspottkörteln','Tillverkar matsmältningsenzymer och hormonet insulin som styr blodsockret.','Den är både en matsmältningskörtel och en hormonkörtel på samma gång.'],
  en:['Pancreas','Makes digestive enzymes and the hormone insulin, which controls blood sugar.','It is both a digestive gland and a hormone gland at the same time.']},
 kidneys:{sys:'uri',sv:['Njurarna','Filtrerar blodet och gör urin av överblivet vatten och slaggprodukter. Den högra sitter lite lägre, under levern.','Tillsammans filtrerar de ungefär 180 liter vätska per dygn.'],
  en:['Kidneys','Filter the blood and turn extra water and waste into urine. The right one sits a little lower, under the liver.','Together they filter about 180 liters of fluid every day.']},
 adrenal:{sys:'endo',sv:['Binjurarna','Sitter som små mössor ovanpå njurarna och tillverkar bland annat adrenalin och kortisol.','Adrenalin gör att hjärtat slår snabbare när man blir rädd eller spänd.'],
  en:['Adrenal glands','Sit like little caps on top of the kidneys and make hormones such as adrenaline and cortisol.','Adrenaline makes your heart beat faster when you get scared or excited.']},
 ureters:{sys:'uri',sv:['Urinledarna','Två tunna rör som för urin från njurarna ner till urinblåsan.','Urinen trycks fram med små muskelvågor, inte bara med tyngdkraften.'],
  en:['Ureters','Two thin tubes that carry urine from the kidneys down to the bladder.','Urine is pushed along by small muscle waves, not just by gravity.']},
 bladder:{sys:'uri',sv:['Urinblåsan','En töjbar påse som samlar urin tills det är dags att gå på toaletten.','Hos en vuxen rymmer den ungefär en halv liter.'],
  en:['Bladder','A stretchy bag that collects urine until it is time to go to the toilet.','In an adult it holds about half a liter.']},
 smallInt:{sys:'dig',sv:['Tunntarmen','Här tas det mesta av näringen upp i blodet. Den är lång och ligger hopvikt i buken.','Den är ungefär 6–7 meter lång.'],
  en:['Small intestine','This is where most nutrients are absorbed into the blood. It is long and folded up in the belly.','It is about 6–7 meters long.']},
 largeInt:{sys:'dig',sv:['Tjocktarmen','Tar upp vatten och salter från det som är kvar av maten och formar avföring. Här lever biljoner nyttiga bakterier.','Den är ungefär 1,5 meter lång men mycket bredare än tunntarmen.'],
  en:['Large intestine','Absorbs water and salts from what is left of the food and forms poop. Trillions of helpful bacteria live here.','It is about 1.5 meters long but much wider than the small intestine.']},
 appendix:{sys:'dig',sv:['Blindtarmsbihanget','En liten, smal utbuktning från tjocktarmen. Den kan bli inflammerad och behöva opereras bort.','Forskare tror att den kan fungera som ett förråd för goda tarmbakterier.'],
  en:['Appendix','A small, narrow pouch off the large intestine. It can get inflamed and need to be removed.','Scientists think it may work as a storage place for good gut bacteria.']},
 spinalCord:{sys:'nerv',sv:['Ryggmärgen','En tjock nervsträng inuti ryggraden som skickar signaler mellan hjärnan och resten av kroppen.','Vissa reflexer, som att dra bort handen från något hett, styrs direkt av ryggmärgen innan hjärnan hunnit reagera.'],
  en:['Spinal cord','A thick bundle of nerves inside the spine that carries signals between the brain and the rest of the body.','Some reflexes, like pulling your hand away from something hot, are handled by the spinal cord before the brain has time to react.']},
 armNerves:{sys:'nerv',sv:['Armens nerver','Medianusnerven och radialisnerven kommer från halsens del av ryggmärgen. De styr armens muskler och ger känsel i huden.','Medianusnerven kan klämmas i handleden. Det kallas karpaltunnelsyndrom.'],
  en:['Arm nerves','The median and radial nerves come from the neck part of the spinal cord. They control the arm’s muscles and give feeling to the skin.','The median nerve can get squeezed at the wrist. That is called carpal tunnel syndrome.']},
 ulnar:{sys:'nerv',sv:['Ulnarisnerven','Går längs lillfingersidan av armen och passerar strax under huden vid armbågen.','Det är den som gör att det stickar i lillfingret när man slår i ”tjuvnerven”.'],
  en:['Ulnar nerve','Runs along the little-finger side of the arm and passes just under the skin at the elbow.','It is what makes your little finger tingle when you hit your “funny bone”.']},
 sciatic:{sys:'nerv',sv:['Ischiasnerven','Kroppens tjockaste och längsta nerv. Den går från ländryggen genom skinkan och ner längs benets baksida.','Där den är som tjockast är den ungefär lika bred som en tumme.'],
  en:['Sciatic nerve','The thickest and longest nerve in the body. It runs from the lower back through the buttock and down the back of the leg.','At its thickest it is about as wide as a thumb.']},
 femoral:{sys:'nerv',sv:['Lårnerven','Går ner längs lårets framsida och styr musklerna som sträcker knät.','Den ger också känsel på lårets framsida och på insidan av underbenet.'],
  en:['Femoral nerve','Runs down the front of the thigh and controls the muscles that straighten the knee.','It also gives feeling to the front of the thigh and the inside of the lower leg.']},
 vagus:{sys:'nerv',sv:['Vagusnerven','Går från hjärnstammen ner till hjärta, lungor och mage. Den hjälper kroppen att varva ner efter stress.','”Vagus” betyder ”vandrande” på latin. Den slingrar sig genom stora delar av kroppen.'],
  en:['Vagus nerve','Runs from the brainstem down to the heart, lungs and stomach. It helps the body calm down after stress.','“Vagus” is Latin for “wandering”. It winds through large parts of the body.']},
 aorta:{sys:'circ',sv:['Aortan','Kroppens största artär. Den leder syrerikt blod från hjärtat ut till hela kroppen.','Hos en vuxen är den ungefär lika tjock som en trädgårdsslang.'],
  en:['Aorta','The body’s largest artery. It carries oxygen-rich blood from the heart out to the whole body.','In an adult it is about as thick as a garden hose.']},
 carotid:{sys:'circ',sv:['Halspulsådrorna','För blod till huvudet och hjärnan.','Det är här man känner pulsen på sidan av halsen.'],
  en:['Carotid arteries','Carry blood to the head and brain.','This is where you can feel your pulse on the side of your neck.']},
 armArtery:{sys:'circ',sv:['Armens artärer','För syrerikt blod ut i armen och handen.','Pulsen vid handleden känns i strålbensartären, på tumsidan.'],
  en:['Arm arteries','Carry oxygen-rich blood out to the arm and hand.','The pulse at your wrist is felt in the radial artery, on the thumb side.']},
 femoralA:{sys:'circ',sv:['Benets artärer','Höftartären och lårartären för blod ner genom benet till foten.','Man kan känna pulsen i ljumsken där lårartären passerar.'],
  en:['Leg arteries','The iliac and femoral arteries carry blood down through the leg to the foot.','You can feel a pulse in the groin where the femoral artery passes.']},
 pulmonary:{sys:'circ',sv:['Lungpulsådern','För syrefattigt blod från hjärtat till lungorna. Därför är den blå här, fast den är en artär.','Det är den enda stora artären som för syrefattigt blod.'],
  en:['Pulmonary artery','Carries oxygen-poor blood from the heart to the lungs. That is why it is blue here, even though it is an artery.','It is the only major artery that carries oxygen-poor blood.']},
 venaCava:{sys:'circ',sv:['Hålvenerna','Kroppens största vener. Den övre och den nedre för tillbaka syrefattigt blod till hjärtat.','Blod är alltid rött. Vener ritas blå bara för att skilja dem från artärer.'],
  en:['Venae cavae','The body’s largest veins. The upper and lower one bring oxygen-poor blood back to the heart.','Blood is always red. Veins are drawn blue just to tell them apart from arteries.']},
 jugular:{sys:'circ',sv:['Halsvenerna','För blod tillbaka från huvudet och hjärnan.','Ibland syns den yttre halsvenen när någon sjunger eller skriker.'],
  en:['Jugular veins','Bring blood back from the head and brain.','Sometimes you can see the outer jugular vein when someone sings or shouts.']},
 armVein:{sys:'circ',sv:['Armens vener','För tillbaka blodet från handen och armen.','Det är oftast i en ven i armvecket man tar blodprov.'],
  en:['Arm veins','Bring blood back from the hand and arm.','Blood tests are usually taken from a vein in the crook of the elbow.']},
 legVein:{sys:'circ',sv:['Benets vener','För blodet uppåt tillbaka till hjärtat, med hjälp av små klaffar och vadmusklerna.','Stora vena saphena på benets insida är kroppens längsta ven.'],
  en:['Leg veins','Carry blood upward back to the heart, helped by tiny valves and the calf muscles.','The great saphenous vein on the inside of the leg is the longest vein in the body.']}
};
Object.assign(INFO,{
 hyoid:{sys:'skel',sv:['Tungbenet','Ett hästskoformat ben högt upp på halsen. Det sitter inte ihop med något annat ben utan hålls på plats av muskler.','Tungan och struphuvudet hänger i tungbenet. Det hjälper till när man sväljer och pratar.'],
  en:['Hyoid bone','A horseshoe-shaped bone high in the neck. It isn’t joined to any other bone and is held in place by muscles.','The tongue and voice box hang from the hyoid. It helps you swallow and speak.']},
 discs:{sys:'skel',sv:['Mellankotskivorna','Stötdämpande skivor av brosk mellan kotorna. De gör ryggen böjlig.','På morgonen är man upp till en centimeter längre än på kvällen, eftersom skivorna trycks ihop under dagen.'],
  en:['Intervertebral discs','Shock-absorbing pads of cartilage between the vertebrae. They make the back flexible.','You are up to a centimeter taller in the morning than in the evening, because the discs get squeezed during the day.']},
 costalCartilage:{sys:'skel',sv:['Revbensbrosket','Brosk som fäster revbenen i bröstbenet. Det är böjligt så att bröstkorgen kan vidgas när man andas.','Med åren kan brosket förbenas och bli stelare.'],
  en:['Costal cartilage','Cartilage that joins the ribs to the breastbone. It is bendy so the chest can expand when you breathe.','With age the cartilage can turn partly to bone and get stiffer.']},
 brainstem:{sys:'nerv',sv:['Hjärnstammen','Förbinder hjärnan med ryggmärgen. Den består av mitthjärnan, hjärnbryggan och förlängda märgen.','Hjärnstammen sköter livsviktiga saker automatiskt, som andning, hjärtrytm och att man vaknar.'],
  en:['Brainstem','Connects the brain to the spinal cord. It is made of the midbrain, pons and medulla oblongata.','The brainstem runs vital things automatically, like breathing, heartbeat and waking up.']},
 pituitary:{sys:'endo',sv:['Hypofysen','En ärtstor körtel under hjärnan som styr många av kroppens andra hormonkörtlar.','Den tillverkar bland annat tillväxthormon, som får barn att växa.'],
  en:['Pituitary gland','A pea-sized gland under the brain that controls many of the body’s other hormone glands.','Among other things it makes growth hormone, which makes children grow.']},
 tongue:{sys:'dig',sv:['Tungan','En muskel som flyttar runt maten i munnen, hjälper till att svälja och formar ljud när man pratar.','Tungan har tusentals smaklökar och kan känna sött, salt, surt, beskt och umami.'],
  en:['Tongue','A muscle that moves food around the mouth, helps you swallow and shapes sounds when you speak.','The tongue has thousands of taste buds and can sense sweet, salty, sour, bitter and umami.']},
 salivary:{sys:'dig',sv:['Spott- och tårkörtlar','Underkäksspottkörtlarna gör saliv som fuktar maten och börjar bryta ner stärkelse. Tårkörtlarna ovanför ögonen håller ögonen fuktiga.','Man producerar ungefär en liter saliv per dygn.'],
  en:['Salivary and tear glands','The submandibular glands make saliva that moistens food and starts breaking down starch. The tear glands above the eyes keep the eyes moist.','You make about a liter of saliva every day.']},
 thymus:{sys:'imm',sv:['Brässen (tymus)','Sitter bakom bröstbenet. Här tränas T-celler, en sorts vita blodkroppar som är viktiga för immunförsvaret.','Brässen är som störst i barndomen och krymper sedan successivt efter puberteten.'],
  en:['Thymus','Sits behind the breastbone. This is where T cells, a type of white blood cell important for immunity, are trained.','The thymus is largest in childhood and slowly shrinks after puberty.']},
 airways:{sys:'resp',sv:['Luftvägarna','Luftstrupen delar sig i två huvudbronker, och de grenar sig sedan som ett upp-och-nervänt träd ut i lungorna.','Bronkträdet delar sig drygt 20 gånger innan luften når de små lungblåsorna.'],
  en:['Airways','The windpipe splits into two main bronchi, which branch like an upside-down tree out into the lungs.','The bronchial tree splits more than 20 times before the air reaches the tiny air sacs.']},
 prostate:{sys:'uri',sv:['Prostata','En körtel hos män, strax under urinblåsan, som omger urinröret.','Den är ungefär lika stor som en valnöt.'],
  en:['Prostate','A gland in men, just below the bladder, that surrounds the urethra.','It is about the size of a walnut.']},
 pectMinor:{sys:'musc',sv:['Lilla bröstmuskeln','Ligger under stora bröstmuskeln och drar skulderbladet framåt och nedåt.','Den hjälper också till att lyfta revbenen när man andas in djupt.'],
  en:['Pectoralis minor','Lies under the pectoralis major and pulls the shoulder blade forward and down.','It also helps lift the ribs when you take a deep breath.']},
 serratus:{sys:'musc',sv:['Främre sågmuskeln','Fäster med flikar på revbenen, som tänderna på en såg, och håller skulderbladet mot bröstkorgen.','Den kallas ibland ”boxarmuskeln” eftersom den används när man slår ett rakt slag.'],
  en:['Serratus anterior','Attaches to the ribs with finger-like strips, like the teeth of a saw, and holds the shoulder blade against the rib cage.','It is sometimes called the “boxer’s muscle” because it is used to throw a straight punch.']},
 rhomboids:{sys:'musc',sv:['Rombmusklerna','Mellan ryggraden och skulderbladen. De drar ihop skulderbladen bakåt.','Det är de här man använder när man sträcker på sig och drar axlarna bakåt.'],
  en:['Rhomboids','Between the spine and the shoulder blades. They pull the shoulder blades back together.','These are the ones you use when you stand up straight and pull your shoulders back.']},
 levScap:{sys:'musc',sv:['Skulderbladslyftaren','Går från halskotorna ner till skulderbladet och lyfter det, som när man rycker på axlarna.','Den blir ofta spänd och öm när man sitter länge framför en skärm.'],
  en:['Levator scapulae','Runs from the neck vertebrae down to the shoulder blade and lifts it, like when you shrug.','It often gets tight and sore when you sit in front of a screen for a long time.']},
 psoas:{sys:'musc',sv:['Stora ländmuskeln','En djup muskel som går från ländryggen genom bäckenet till lårbenet. Den lyfter benet framåt.','Den är en av få muskler som förbinder ryggraden direkt med benen.'],
  en:['Psoas major','A deep muscle that runs from the lower back through the pelvis to the thighbone. It lifts the leg forward.','It is one of the few muscles that connects the spine directly to the legs.']},
 piriformis:{sys:'musc',sv:['Päronformade muskeln','En liten djup muskel i sätet som vrider höften utåt.','Ischiasnerven passerar strax under den, och en spänd piriformis kan klämma nerven.'],
  en:['Piriformis','A small deep muscle in the buttock that turns the hip outward.','The sciatic nerve passes just beneath it, and a tight piriformis can squeeze the nerve.']},
 brachialis:{sys:'musc',sv:['Armbågsböjaren','Ligger under biceps och är den starkaste böjaren av armbågen.','Den jobbar alltid när man böjer armen, oavsett hur handen är vänd.'],
  en:['Brachialis','Lies under the biceps and is the strongest bender of the elbow.','It always works when you bend your arm, no matter which way your hand faces.']},
 itTract:{sys:'musc',sv:['Höftbensbandet','En lång, tålig senplatta längs lårets utsida, från höften till knät.','Löpare kan få ont här om bandet skaver mot knät, så kallat löparknä.'],
  en:['Iliotibial band','A long, tough band of tendon tissue along the outside of the thigh, from hip to knee.','Runners can get pain here if the band rubs against the knee, called runner’s knee.']},
 eyeMuscles:{sys:'musc',sv:['Ögonmusklerna','Sex små muskler per öga som vrider ögongloben åt alla håll, plus en som lyfter ögonlocket.','Ögonmusklerna är bland de snabbaste musklerna i kroppen.'],
  en:['Eye muscles','Six small muscles per eye that turn the eyeball in every direction, plus one that lifts the eyelid.','The eye muscles are among the fastest muscles in the body.']},
 coronary:{sys:'circ',sv:['Kranskärlen','Artärerna som ligger som en krona runt hjärtat och förser själva hjärtmuskeln med syrerikt blod.','Om ett kranskärl täpps till kan man få en hjärtinfarkt.'],
  en:['Coronary arteries','The arteries that wrap around the heart like a crown and supply the heart muscle itself with oxygen-rich blood.','If a coronary artery gets blocked, it can cause a heart attack.']},
 pulmonaryArt:{sys:'circ',sv:['Lungartärerna','För syrefattigt blod från hjärtat ut i lungorna. Därför är de blå här, fast de är artärer.','De grenar sig parallellt med luftrören ända ut till lungblåsorna.'],
  en:['Pulmonary arteries','Carry oxygen-poor blood from the heart out into the lungs. That is why they are blue here, even though they are arteries.','They branch alongside the airways all the way out to the air sacs.']},
 pulmonaryVeins:{sys:'circ',sv:['Lungvenerna','För syrerikt blod från lungorna tillbaka till hjärtat. Därför är de röda, fast de är vener.','Det är de enda venerna i kroppen som för syrerikt blod.'],
  en:['Pulmonary veins','Carry oxygen-rich blood from the lungs back to the heart. That is why they are red, even though they are veins.','They are the only veins in the body that carry oxygen-rich blood.']},
 brainArt:{sys:'circ',sv:['Hjärnans artärer','Halsartärerna och kotartärerna möts under hjärnan i en ring och grenar sig sedan ut över hela hjärnan.','Hjärnan är bara 2 procent av kroppsvikten men får ungefär 15 procent av blodet.'],
  en:['Brain arteries','The carotid and vertebral arteries meet under the brain in a ring and then branch out over the whole brain.','The brain is only 2 percent of body weight but gets about 15 percent of the blood.']},
 gutArt:{sys:'circ',sv:['Tarmarnas och bukens artärer','Grenar från aortan som för blod till magsäck, lever, mjälte, bukspottkörtel och tarmar.','Efter en stor måltid går ungefär en fjärdedel av hjärtats blod till matsmältningen.'],
  en:['Gut and abdominal arteries','Branches of the aorta that bring blood to the stomach, liver, spleen, pancreas and intestines.','After a big meal about a quarter of the heart’s output goes to digestion.']},
 renalArt:{sys:'circ',sv:['Njurartärerna','Korta, kraftiga artärer från aortan till njurarna.','Ungefär en femtedel av allt blod hjärtat pumpar går genom njurarna.'],
  en:['Renal arteries','Short, wide arteries from the aorta to the kidneys.','About a fifth of all the blood the heart pumps passes through the kidneys.']},
 legArt:{sys:'circ',sv:['Benens artärer','Höftartärerna, lårartären och knäartären för blod ner genom benet till foten.','Man kan känna pulsen i ljumsken, bakom knät och på fotryggen.'],
  en:['Leg arteries','The iliac, femoral and popliteal arteries carry blood down through the leg to the foot.','You can feel a pulse in the groin, behind the knee and on top of the foot.']},

function pick(id,fromList){
  selected=id;hideHint();
  if(fromList){const p=PARTS[id];if(!layerOn[p.layer]){layerOn[p.layer]=true;save();}if(p.layer!=='skin'&&layerOn.skin)xray=true;
    if(p.layer!=='muscle'&&p.layer!=='skin'&&layerOn.muscle)xray=true;}
  if(isolate&&isolate!==id)isolate=null;
  refreshUI();renderCard();flyTo(id);
}
function home(){selected=null;isolate=null;refreshUI();renderCard();
  fly={t0:performance.now(),dur:1100,from:{target:cam.target.slice(),yaw:cam.yaw,pitch:cam.pitch,dist:cam.dist},to:{target:HOME.target.slice(),yaw:Math.round(cam.yaw/(2*Math.PI))*2*Math.PI,pitch:HOME.pitch,dist:HOME.dist}};}
document.getElementById('home').onclick=home;
{const lb=document.getElementById('live');lb.setAttribute('aria-pressed',animOn);lb.onclick=()=>{animOn=!animOn;lb.setAttribute('aria-pressed',animOn);try{localStorage.setItem('anim',animOn?'on':'off');}catch(e){}dirty=true;};}
let hinted=true;function hideHint(){if(hinted){hinted=false;hintEl.style.opacity=0;setTimeout(()=>hintEl.hidden=true,700);}}

/* ================= input ================= */
const ptrs=new Map();let tap=null,lastPinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});
  if(ptrs.size===1)tap={x:e.clientX,y:e.clientY,t:performance.now()};else tap=null;lastPinch=null;fly=null;if(!listEl.hidden)toggleList(false);});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){if(p.b===2||e.shiftKey)pan(dx,dy);else{cam.yaw-=dx*.008;cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch+dy*.008));}}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(lastPinch){cam.dist=Math.max(.8,Math.min(60,cam.dist*lastPinch.d/d));pan(mx-lastPinch.mx,my-lastPinch.my);}lastPinch={d,mx,my};}
  if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8){tap=null;hideHint();}dirty=true;});
function endPtr(e){ptrs.delete(e.pointerId);lastPinch=null;
  if(tap&&ptrs.size===0&&performance.now()-tap.t<500&&e.type==='pointerup'){const r=canvas.getBoundingClientRect();const id=pickAt(e.clientX-r.left,e.clientY-r.top);if(id)pick(id);}tap=null;}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();fly=null;cam.dist=Math.max(.8,Math.min(60,cam.dist*Math.exp(e.deltaY*.0012)));hideHint();dirty=true;},{passive:false});
function pan(dx,dy){const e=eye();const f=norm(sub(cam.target,e)),r=norm(cross(f,[0,1,0])),u=cross(r,f);const k=cam.dist*Math.tan(cam.fov/2)*2/canvas.clientHeight;
  cam.target=add(cam.target,add(scl(r,-dx*k),scl(u,dy*k)));}

/* ================= loop ================= */
function layout(){const W=canvas.clientWidth,H=canvas.clientHeight,r=dpr();if(canvas.width!==Math.round(W*r)||canvas.height!==Math.round(H*r)){canvas.width=Math.round(W*r);canvas.height=Math.round(H*r);}
  cam.shift=cardEl.hidden?0:Math.min(H*.2,cardEl.offsetHeight*.5+20);dirty=true;}
addEventListener('resize',layout);
let lastDraw=0,drawAvg=10,animGap=32;
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function frame(now){
  if(fly){const k=ease(Math.min(1,(now-fly.t0)/fly.dur));const a=fly.from,b=fly.to;cam.target=lerp(a.target,b.target,k);cam.yaw=a.yaw+(b.yaw-a.yaw)*k;cam.pitch=a.pitch+(b.pitch-a.pitch)*k;cam.dist=a.dist+(b.dist-a.dist)*k;if(k>=1)fly=null;dirty=true;}
  const live=animating();if(live)animT=now/1000;
  if(dirty||((selected||live)&&now-lastDraw>animGap)){const t0=performance.now();draw(now);const dt=performance.now()-t0;drawAvg=drawAvg*.9+dt*.1;animGap=Math.min(250,Math.max(32,drawAvg*3));dirty=false;lastDraw=now;}
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
buildLayerButtons;applyLang();refreshUI();layout();
(async()=>{
  const lt=document.getElementById('loadTxt');
  if(!gl){lt.textContent=S('nogl');return;}
  try{await loadModel();}catch(e){lt.textContent=S('err');console.error(e);return;}
  const bh=BODY.max[1]-BODY.min[1];cam.target=[(BODY.min[0]+BODY.max[0])/2,BODY.min[1]+bh*.5,(BODY.min[2]+BODY.max[2])/2];
  cam.target[1]-=bh*.035;cam.dist=bh*.5/Math.tan(cam.fov/2)*1.22;HOME={target:cam.target.slice(),pitch:cam.pitch,dist:cam.dist};
  buildLayerButtons();applyLang();refreshUI();layout();
  document.getElementById('loading').style.opacity=0;
  window.__ready=true;requestAnimationFrame(frame);
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
